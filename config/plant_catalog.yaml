  source_heading: Парки *Бульвары, скверы, набережные, сады
- id: industrial_and_protection
  name_ru: Производственные, охранные и санитарно-защитные территории
  source_heading: Территории производственного назначения *Озелененные территории охранных и санитарно-защитных зон
notes:
- code: '1'
  text: Разрешён на всех территориях, кроме ООЗТ и ПТ, с контролем распространения (п. 5 ПП №369-ПП)
- code: '2'
  text: Не высаживать вблизи детских и спортивных площадок, мест массового пребывания детей
- code: '3'
  text: 'Требует особого ухода: защита корневой системы от травм, весеннее дождевание кроны (при посадке у дорог), мульчирование,
    рыхление'
- code: '4'
  text: Требует дренированных, рыхлых, незасоленных, неуплотнённых почв. Не высаживать в зонах с застойным увлажнением и на
    уплотнённых грунтах
- code: '5'
  text: Чувствительно к противогололёдным реагентам и выхлопным газам
- code: '6'
  text: Не высаживать вблизи плодовых культур (яблоня, груша, айва) из-за риска распространения ржавчинных грибов
- code: '7'
  text: Вид с потенциалом самосева и неконтролируемого распространения. За пределами ООЗТ посадка допускается на расстоянии
    от 1 до 2 км от их границ при условии регулярного контроля
scope_notes:
- На территориях ботанических, зоологических садов, кладбищ, мемориальных комплексов и религиозных организаций породный состав
  для озеленения определяется балансодержателем. В границах особо охраняемых природных территорий, особо охраняемых зеленых
  территорий, природных территорий на участках, занятых естественными растительными сообществами, породный состав определяется
  на основании проекта мероприятий по сохранению, развитию и воспроизводству насаждений.
- На территориях инклюзивных площадок для людей с ограниченными возможностями породный состав определяется на основании проекта
  мероприятий по сохранению, развитию и воспроизводству насаждений.
- На территориях высших учебных заведений породный состав определяется на основании проекта мероприятий по сохранению, развитию
  и воспроизводству насаждений.
- '*Обозначенный перечень территорий озеленения вне границ ООЗТ, на которых возможна высадка рекомендуемого растения при условии
  контроля его распространения.'
